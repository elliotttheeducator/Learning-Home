<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17233D;
    --ink-soft: #4A5775;
    --page: #F4F7FC;
    --panel: #FFFFFF;
    --line: #D9E1EE;
    --focus: #FFB400;
    --font: "Lexend", "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 20px; line-height: 1.5; }
  a { color: inherit; }
  :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; border-radius: 6px; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 48px 24px 64px; }
  h1 { font-size: clamp(44px, 7vw, 84px); font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin: 0 0 12px; }
  .lede { font-size: 24px; color: var(--ink-soft); margin: 0 0 40px; }

  /* Class picker: each class is a coloured block led by its year number */
  .classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .cls {
    all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
    min-height: 200px; padding: 20px 22px; border-radius: 20px; color: #fff; background: var(--c);
    box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 70%, #000);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cls:hover { transform: translateY(-3px); box-shadow: 0 9px 0 color-mix(in srgb, var(--c) 70%, #000); }
  .cls:focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }
  .cls .yr { font-size: 96px; font-weight: 800; line-height: .9; letter-spacing: -0.04em; }
  .cls .nm { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .cls .ct { font-size: 17px; opacity: .9; }

  .hint { font-size: 22px; color: var(--ink-soft); text-align: center; margin-top: 44px; }
  .again { display: inline-block; margin: 0 0 28px; font-size: 22px; font-weight: 700; text-decoration: none;
    padding: 10px 20px; border-radius: 999px; background: var(--c); color: #fff; }
  .again:hover { filter: brightness(1.06); }
  footer { max-width: 1200px; margin: 0 auto; padding: 0 24px 40px; font-size: 16px; color: var(--ink-soft); }
  footer a { color: var(--ink-soft); }

  @media (max-width: 560px) {
    .wrap { padding: 28px 16px 48px; }
    .cls { min-height: 150px; } .cls .yr { font-size: 72px; }
  }
  @media (prefers-reduced-motion: reduce) { .cls { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>Learning Home</h1>
  <p class="lede">Pick your class to see your lessons, slides, apps and booklets.</p>
  <div id="again"></div>
  <nav class="classes" id="classes" aria-label="Classes"></nav>
</main>
<footer><a href="/teacher/">Teacher sign in</a></footer>

<script>
const DAY_ORDER = ["Mon", "Tue", "Wed", "Thu", "Fri"];
function yearOf(name) { const m = name.match(/Year\s*(\d+)/i); return m ? m[1] : ""; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function days(c) {
  const d = [...new Set((c.timetable || []).map(s => s.day))].sort((a, b) => DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b));
  return d.length ? d.join(", ") : "";
}

fetch("/catalog.json", { cache: "no-store" })
  .then(r => r.json())
  .then(data => {
    document.getElementById("classes").innerHTML = data.classes.map(c => `
      <a class="cls" style="--c:${esc(c.colour)}" href="/${esc(c.id)}">
        <span class="yr">${esc(yearOf(c.name))}</span>
        <span><span class="nm">${esc(c.name.replace(/^Year\s*\d+\s*/i, ""))}</span><br>
        <span class="ct">${esc(days(c))}</span></span>
      </a>`).join("");
    // Old links used /#class-id. Send them to the class calendar.
    const old = data.classes.find(x => "#" + x.id === location.hash);
    if (old) { location.replace("/" + old.id); return; }
    let last = "";
    try { last = localStorage.getItem("lh-class") || ""; } catch (e) {}
    const c = data.classes.find(x => x.id === last);
    if (c) document.getElementById("again").innerHTML =
      `<a class="again" style="--c:${esc(c.colour)}" href="/${esc(c.id)}">Back to ${esc(c.name)} &#8594;</a>`;
  })
  .catch(() => { document.getElementById("classes").outerHTML = '<p class="hint">The class list did not load. Refresh the page to try again.</p>'; });
</script>
</body>
</html>
